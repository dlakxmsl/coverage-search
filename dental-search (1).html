/* ===================== 렌더링 ===================== */
const prodNav = document.getElementById('prodNav');
const prodResult = document.getElementById('prodResult');
const searchInput = document.getElementById('searchInput');

PRODUCTS.forEach(p=>{
  const b = document.createElement('button');
  b.textContent = p.short;
  b.dataset.id = p.id;
  b.addEventListener('click', ()=>{ searchInput.value=''; showProducts([p.id]); setActiveNav([p.id]); });
  prodNav.appendChild(b);
});

function setActiveNav(ids){
  Array.prototype.forEach.call(prodNav.children, function(btn){
    btn.classList.toggle('on', ids.indexOf(btn.dataset.id) !== -1);
  });
}

function showProducts(ids){
  if(ids.length===0){
    prodResult.innerHTML = '<div class="no-result">일치하는 상품이 없습니다.<br>검색어 예시: 건강한 / 리셋 / 실속 / 덴탈어카운트 / 간편</div>';
    return;
  }
  prodResult.innerHTML = ids.map(function(id){ return PRODUCT_HTML[id]; }).join('');
}

showProducts(PRODUCTS.map(function(p){return p.id;}));

searchInput.addEventListener('input', function(){
  const q = searchInput.value.trim();
  if(q===''){
    showProducts(PRODUCTS.map(function(p){return p.id;}));
    setActiveNav([]);
    return;
  }
  const matched = PRODUCTS.filter(function(p){
    return p.name.indexOf(q)!==-1 || p.short.indexOf(q)!==-1 || p.kw.indexOf(q)!==-1;
  });
  showProducts(matched.map(function(p){return p.id;}));
  setActiveNav(matched.map(function(p){return p.id;}));
});

document.getElementById('uwResult').innerHTML = UW_HTML;
document.getElementById('ruleResult').innerHTML = RULE_HTML;
document.getElementById('claimResult').innerHTML = CLAIM_HTML;
document.getElementById('refResult').innerHTML = REF_HTML;

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    window.scrollTo(0,0);
  });
});
</script>
