<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="간편 가입한도">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F5EF">
<title>브레인케어 간편 가입한도 검색</title>
<style>
  :root{
    --paper:#F7F5EF; --paper-card:#FFFFFF; --paper-alt:#EFEAE0;
    --ink:#1B2A4A; --ink-soft:#3C4A66; --indigo:#2F4172; --indigo-deep:#22335A;
    --blue-dot:#2B6CB0; --red-x:#B23A33; --amber:#9A6B1E; --teal:#1F6B5C;
    --line:#DAD5C8; --line-soft:#E8E3D7; --muted:#6B7280;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:18px 18px 14px;border-bottom:1px solid var(--line);flex-shrink:0;position:sticky;top:0;background:var(--paper);z-index:10;}
  .brand{font-family:'Apple SD Gothic Neo','Noto Serif KR',sans-serif;font-weight:700;font-size:19px;color:var(--ink);margin-bottom:10px;}
  .brand span{font-size:11.5px;color:var(--muted);font-weight:400;font-family:'Noto Sans KR',sans-serif;margin-left:8px;}
  .mode-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .mtab{flex:1;padding:8px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper-card);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;}
  .mtab.on{border-color:var(--ink);background:var(--ink);color:#fff;}
  .cat-header{font-size:13px;font-weight:700;color:var(--indigo);margin:20px 0 8px;padding-bottom:4px;border-bottom:1.5px solid var(--line);}
  .cat-header:first-child{margin-top:0;}
  .agg-block-card{background:var(--paper-alt);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:12px;color:var(--ink-soft);line-height:1.75;white-space:pre-wrap;}
  .agg-block-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;white-space:normal;}
  #searchBox{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;font-size:17px;font-family:inherit;color:var(--ink);background:var(--paper-card);}
  #searchBox:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6;}
  main{flex:1;padding:14px 18px 40px;overflow-y:auto;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:60px 20px;line-height:1.8;}
  .section-label{font-size:11.5px;font-weight:700;color:var(--indigo);margin:18px 0 8px;letter-spacing:0.02em;}
  .section-label:first-child{margin-top:0;}
  .card{background:var(--paper-card);border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .card-title{font-family:'Apple SD Gothic Neo','Noto Serif KR',sans-serif;font-weight:600;font-size:15px;color:var(--ink);margin-bottom:8px;}
  .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;border-top:1px solid var(--line-soft);}
  .row:first-of-type{border-top:none;}
  .row .k{color:var(--muted);flex-shrink:0;}
  .row .v{text-align:right;font-weight:500;}
  .limit-amt{font-family:'SF Mono','Courier New',monospace;font-weight:700;color:var(--indigo);font-size:15px;}
  .agg-label{font-size:11px;color:var(--amber);font-weight:700;margin-bottom:4px;font-family:'Noto Sans KR',sans-serif;}
  .code-pill{display:inline-block;font-family:'SF Mono','Courier New',monospace;font-size:11.5px;font-weight:700;background:var(--paper-alt);color:var(--ink-soft);padding:2px 7px;border-radius:5px;margin-left:6px;}
  .jong-pill{display:inline-block;font-size:11.5px;font-weight:700;background:var(--indigo);color:#fff;padding:2px 9px;border-radius:999px;}
  .camp-pill{display:inline-block;font-size:10.5px;font-weight:700;background:#FBE9E7;color:var(--red-x);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;}
  .note{font-size:11.5px;color:var(--amber);margin-top:8px;line-height:1.6;white-space:pre-wrap;}
  .sum-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .sum-box{border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;}
  .sum-box.same{background:#EEF1F8;color:var(--ink-soft);}
  .sum-box.other{background:#EAF4F1;color:var(--ink-soft);}
  .sum-box .t{display:block;font-size:11px;font-weight:700;margin-bottom:3px;white-space:normal;}
  .sum-box.same .t{color:var(--indigo);}
  .sum-box.other .t{color:var(--teal);}
  .sum-box .none{color:var(--muted);}
  @media (max-width:420px){ .sum-wrap{grid-template-columns:1fr;} }
  .sum-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px;background:var(--paper-card);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;margin-bottom:10px;}
  .sum-table th{background:var(--paper-alt);color:var(--ink);font-weight:700;padding:7px 8px;text-align:left;font-size:11.5px;}
  .sum-table td{padding:7px 8px;border-top:1px solid var(--line-soft);vertical-align:top;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;}
  .sum-table th:nth-child(1){width:30%;} .sum-table th:nth-child(3){width:24%;}
  .sum-table td.n{font-weight:600;color:var(--ink);}
  .sum-table td.o{color:var(--teal);font-weight:600;}
  .no-result{color:var(--muted);font-size:12.5px;}
  .src{font-size:10.5px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.7;}
  ::selection{background:#D8E0F0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">가입한도 검색<span>라이나 브레인케어 간편(3.2.5)</span></div>
    <div class="mode-tabs">
      <button class="mtab on" id="m-search" onclick="setMode('search')">통합검색</button>
      <button class="mtab" id="m-overview" onclick="setMode('overview')">가입한도 전체</button>
      <button class="mtab" id="m-sum" onclick="setMode('sum')">당사·타사 합산</button>
    </div>
    <input type="text" id="searchBox" placeholder="담보명 · 질병명 · 질병코드 검색 (예: 뇌동맥류, 파킨슨, G30)" autocomplete="off" autocapitalize="off">
    <div class="hint" id="hint">타이핑하는 즉시 결과가 떠요. 인터넷 연결 없이도 작동해요.</div>
  </header>
  <main id="results"></main>
</div>

function findLimit(name){ return LIMITS.find(l=>l.name===name); }
function cumulative(name, n){
  const it = findLimit(name); if(!it) return null;
  let pct=0, tiers=[];
  it.payouts.forEach(p=>{
    const m = p.name.match(/\((\d)(?:-(\d))?종\)/); if(!m) return;
    const lo=parseInt(m[1]), hi=m[2]?parseInt(m[2]):lo;
    if(n>=lo && n<=hi){ const r=parseRatePct(p.rate); pct+=r; tiers.push(m[0].replace(/[()]/g,'')+' '+r+'%'); }
  });
  return {name:name, pct:pct, tiers:tiers, brackets:it.brackets};
}
function flatDiag(name){
  const it = findLimit(name); if(!it) return null;
  return {name:name, pct:parseRatePct(it.payouts[0].rate), tiers:[it.payouts[0].rate+' (최초 1회)'], brackets:it.brackets};
}
function baseCode(code){ return code.split('/')[0].trim().toUpperCase(); }
function inRange(code, letter, lo, hi){
  const m = baseCode(code).match(/^([A-Z])(\d{2})/); if(!m||m[1]!==letter) return false;
  const v=parseInt(m[2]); return v>=lo && v<=hi;
}
const DEMENTIA_CODES = ['F00','F01','F02','F03','G30','G20'];
function isDementiaParkinson(code){ const b=baseCode(code); return DEMENTIA_CODES.some(c=>b===c||b.indexOf(c+'.')===0); }

function calcDiag(catKey, item){
  const n = parseInt(item.jong); const r=[];
  if(catKey==='순환계'){
    const c2 = cumulative('순환계질환Ⅱ 통합진단', n); if(c2 && c2.pct>0) r.push(c2);
    if(n>=3){ r.push(cumulative('순환계질환Ⅰ 통합진단', n)); }
    else r.push({name:'순환계질환Ⅰ 통합진단', na:'2종 — 해당 없음 (순환계질환Ⅰ은 3~5종)'});
    if(inRange(item.code,'I',60,69)) r.push(flatDiag('뇌혈관질환진단'));
    if(inRange(item.code,'I',20,25)) r.push(flatDiag('허혈성심장질환진단'));
  }
  if(catKey==='정신계'){
    r.push(cumulative('정신계질환 통합진단', n));
  }
  if(catKey==='신경계'){
    r.push(cumulative('신경계질환 통합진단', n));
    if(n>=4) r.push(cumulative('중증신경계질환 통합진단', n));
    else r.push({name:'중증신경계질환 통합진단', na:n+'종 — 해당 없음 (4~5종만 보장)'});
  }
  if(isDementiaParkinson(item.code)) r.push(flatDiag('치매파킨슨진단'));
  return r.filter(Boolean);
}

  const n = parseInt(item.jong);
  let html = '<div class="card">';
  html += '<div class="card-title">'+escapeHtml(item.name)+' <span class="code-pill">'+escapeHtml(item.code)+'</span></div>';
  html += '<div class="row"><span class="k">'+catKey+'질환 분류</span><span class="v"><span class="jong-pill">'+escapeHtml(item.jong)+'</span></span></div>';
  const calcs = calcDiag(catKey, item);
  if(calcs.length){
    html += '<div style="margin-top:8px;"><div class="agg-label" style="color:var(--indigo);margin-bottom:5px;">💰 진단보험금 (최대가입한도 기준, 최초 진단 시 누적)</div>';
    calcs.forEach(c=>{
      html += '<div style="margin-bottom:8px;"><div style="font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:3px;">'+escapeHtml(c.name)+'</div>';
      if(c.na){ html += '<div style="font-size:12px;color:var(--red-x);">'+escapeHtml(c.na)+'</div>'; }
      else {
        html += '<div style="font-size:11px;color:var(--muted);margin-bottom:3px;">'+escapeHtml(c.tiers.join(' + '))+'</div>';
        c.brackets.forEach(b=>{
          html += '<div class="row" style="padding:3px 0;"><span class="k" style="font-size:12px;">'+escapeHtml(b.l)+'</span>'
            +'<span class="v"><span style="font-weight:700;color:var(--indigo);font-family:monospace;font-size:14px;">'+fmtMan(b.m*c.pct/100)+'</span>'
            +'<span style="font-size:10.5px;color:var(--muted);margin-left:4px;">('+b.m.toLocaleString('ko-KR')+'만×'+c.pct+'%)</span></span></div>';
        });
      }
      html += '</div>';
    });
    html += '</div>';
  }
  const tr = treatmentsFor(catKey, n);
  if(tr.length) html += '<div class="row" style="margin-top:2px;"><span class="k" style="font-size:11.5px;">치료비 보장</span><span class="v" style="font-size:11.5px;">'+escapeHtml(tr.join(' · '))+'</span></div>';
  else if(catKey!=='순환계') html += '<div class="row" style="margin-top:2px;"><span class="k" style="font-size:11.5px;">치료비 보장</span><span class="v" style="font-size:11.5px;color:var(--red-x);">1종은 치료비 특약 해당 없음 (2~5종만)</span></div>';
  html += '<div class="note" style="color:var(--muted);">진단보험금 감액: '+(catKey==='순환계'?'1년 이내 50%':'180일 이내 20% / 180일 이후~1년 이내 50%')+' · 이미 받은 하위 종 금액은 차감(차액 지급)</div>';
  html += '</div>';
  return html;
}

function aggCard(title){ return '<div class="agg-block-card"><div class="agg-block-title">'+escapeHtml(title)+'</div>'+escapeHtml(AGG_BLOCKS[title])+'</div>'; }

let curMode='search';
function setMode(m){
  curMode=m;
  ['search','overview','sum'].forEach(k=>document.getElementById('m-'+k).classList.toggle('on', m===k));
  const hint=document.getElementById('hint');
  if(m==='overview') hint.textContent='간편 '+LIMITS.length+'개 특약의 가입한도·지급금액·당사/타사 합산을 보여줘요. 검색어를 입력하면 이 안에서 필터링돼요.';
  else if(m==='sum') hint.textContent='특약별 당사합산·타사합산 기준만 표로 모아 봐요. 검색어로 필터링돼요.';
  else hint.textContent='타이핑하는 즉시 결과가 떠요. 인터넷 연결 없이도 작동해요.';
  search(document.getElementById('searchBox').value);
}

function limitMatch(item, q){ return norm(item.name).includes(q) || norm(item.alias).includes(q); }

function renderOverview(query){
  const nq=norm(query||''); let html='';
  const items = nq ? LIMITS.filter(it=>limitMatch(it,nq)||norm(it.same).includes(nq)||norm(it.other).includes(nq)) : LIMITS;
  CAT_ORDER.forEach(cat=>{
    const g=items.filter(i=>i.cat===cat); if(!g.length) return;
    html += '<div class="cat-header">'+escapeHtml(cat)+' ('+g.length+')</div>';
    g.forEach(i=>html+=renderLimitCard(i));
  });
  const aggs = Object.keys(AGG_BLOCKS).filter(t=>!nq||norm(t).includes(nq)||norm(AGG_BLOCKS[t]).includes(nq));
  if(aggs.length){ html += '<div class="cat-header">📎 상품·고지·합산 참고</div>'; aggs.forEach(t=>html+=aggCard(t)); }
  if(!html) html='<div class="empty">"'+escapeHtml(query)+'"에 대한 결과가 없어요.</div>';
  else html += '<div class="src">기준: '+RAW.meta.source+'</div>';
  document.getElementById('results').innerHTML=html;
}

function renderSumTable(query){
  const nq=norm(query||''); let html='';
  const items = nq ? LIMITS.filter(it=>limitMatch(it,nq)||norm(it.same).includes(nq)||norm(it.other).includes(nq)) : LIMITS;
  CAT_ORDER.forEach(cat=>{
    const g=items.filter(i=>i.cat===cat); if(!g.length) return;
    html += '<div class="cat-header">'+escapeHtml(cat)+' ('+g.length+')</div>';
    // 같은 당사합산 문구는 묶어서 한 번만 표시
    const groups=[];
    g.forEach(i=>{ const key=(i.same||'')+'§'+(i.other||''); let gr=groups.find(x=>x.key===key); if(!gr){gr={key:key,same:i.same,other:i.other,names:[]};groups.push(gr);} gr.names.push(i.name); });
    html += '<table class="sum-table"><tr><th>특약</th><th>당사합산</th><th>타사합산</th></tr>';
    groups.forEach(gr=>{
      html += '<tr><td class="n">'+gr.names.map(escapeHtml).join('\n')+'</td>'
        +'<td>'+(gr.same?escapeHtml(gr.same):'<span style="color:var(--muted)">-</span>')+'</td>'
        +'<td class="o">'+((gr.other&&gr.other!=='X')?escapeHtml(gr.other):'')+'</td></tr>';
    });
    html += '</table>';
  });
  if(!html) html='<div class="empty">"'+escapeHtml(query)+'"에 대한 결과가 없어요.</div>';
  else html += '<div class="agg-block-card" style="font-size:11.5px;">※ 합산한도는 UW 공통 가이드라인 확인 (교안 표기)\n※ 당사합산 칸이 "-"인 특약은 교안 표에 당사합산 기준이 비어 있는 특약이에요.</div><div class="src">기준: '+RAW.meta.source+' p51~57</div>';
  document.getElementById('results').innerHTML=html;
}

function search(query){
  if(curMode==='overview') return renderOverview(query);
  if(curMode==='sum') return renderSumTable(query);
  const q=norm(query); const results=document.getElementById('results');
  if(!q){ results.innerHTML=EMPTY_HTML; return; }
  const SYN = {'레켐비':'치매특정신약','뇌졸중':'뇌혈관','중풍':'뇌혈관','심근경색':'허혈성','협심증':'허혈성','생활비':'생활자금','간병비':'생활자금','진단비':'진단'};
  const qList=[q]; Object.keys(SYN).forEach(k=>{ const nk=norm(k); if(q.includes(nk)||nk.includes(q)) qList.push(norm(SYN[k])); });
  let html='', total=0;

  // 1. 질병코드/질병명
  const qU=query.trim().toUpperCase().replace(/\s+/g,'');
  const codeMatches=[]; const matched=[];
  Object.keys(DISEASE_CODES).forEach(cat=>{
    DISEASE_CODES[cat].items.forEach(it=>{
      const codeHit = /[A-Z]/.test(qU) && /\d/.test(qU) ? it.code.toUpperCase().replace(/\s+/g,'').split('/').some(c=>c.indexOf(qU)===0 || (qU.indexOf(c)===0 && qU.charAt(c.length)==='.')) : false;
      const nameHit = norm(it.name).includes(q);
      if(codeHit||nameHit){ codeMatches.push({cat:cat,item:it}); matched.push({cat:cat,n:parseInt(it.jong)}); }
    });
  });
  if(codeMatches.length){
    html+='<div class="section-label">🧬 질병코드 분류 ('+codeMatches.length+')</div>';
    codeMatches.slice(0,30).forEach(m=>html+=renderDiseaseCodeCard(m.cat,m.item));
    total+=codeMatches.length;
  }
  // 2. 가입한도
  const lm = LIMITS.filter(it=>qList.some(x=>limitMatch(it,x)));
  if(lm.length){ html+='<div class="section-label">📋 가입한도 ('+lm.length+')</div>'; lm.forEach(i=>html+=renderLimitCard(i)); total+=lm.length; }
  // 3. 코드 매칭 시 해당 치료비 카드
  if(matched.length && !lm.length){
    const names=[]; matched.forEach(m=>treatmentsFor(m.cat,m.n).forEach(nm=>{ if(names.indexOf(nm)===-1) names.push(nm); }));
    if(names.length){ html+='<div class="section-label">🏥 치료비 한도 ('+names.length+')</div>'; names.forEach(nm=>{const f=findLimit(nm); if(f) html+=renderLimitCard(f);}); total+=names.length; }
  }
  // 4. 참고표
  const am = Object.keys(AGG_BLOCKS).filter(t=>qList.some(x=>norm(t).includes(x)||norm(AGG_BLOCKS[t]).includes(x)));
  if(am.length){ html+='<div class="section-label">📎 상품·고지·합산 참고 ('+am.length+')</div>'; am.forEach(t=>html+=aggCard(t)); total+=am.length; }
  if(!total) html='<div class="empty">"'+escapeHtml(query)+'"에 대한 결과가 없어요.<br><br>다른 표현으로 검색해보세요. (예: 정식 질병명, 담보 약칭, 코드 일부)</div>';
  results.innerHTML=html;
}

const box=document.getElementById('searchBox');
function doSearch(){ search(box.value); }
box.addEventListener('input',doSearch);
box.addEventListener('compositionend',doSearch);
box.addEventListener('keyup',doSearch);
search('');
</script>
