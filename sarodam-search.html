<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="새로담는검색">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F5EF">
<title>새로담는건강보험 검색</title>
<style>
:root{
  --paper:#F7F5EF;--card:#FFF;--alt:#EFEAE0;
  --ink:#1B2A4A;--soft:#3C4A66;--muted:#6B7280;
  --line:#DAD5C8;--line-soft:#E8E3D7;
  --H:#1B4F8A;--G:#6B35A0;--E:#1A7A4A;
  --ok:#2B6CB0;--no:#B23A33;--cond:#9A6B1E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
header{padding:16px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:10;}
.brand{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.brand span{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px;}
/* 모드 탭 */
.mode-tabs{display:flex;gap:6px;margin-bottom:10px;}
.mtab{flex:1;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;}
.mtab.on{border-color:var(--ink);background:var(--ink);color:#fff;}
/* 체류코드 카드 */
.res-card{background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.res-left{flex:1;}
.res-code{font-weight:700;font-size:14px;color:var(--ink);}
.res-label{font-size:11px;color:var(--muted);margin-top:2px;}
.res-note{font-size:10.5px;color:var(--soft);margin-top:6px;line-height:1.6;background:var(--alt);padding:6px 9px;border-radius:6px;}
.res-status{font-size:12px;font-weight:800;padding:4px 10px;border-radius:6px;white-space:nowrap;}
.res-status.ok{color:var(--ok);background:rgba(43,108,176,.1);}
.res-status.no{color:var(--no);background:rgba(178,58,51,.1);}

/* 플러스(BLUE/GOLD) 전용 */
.plus-cats{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.pcbtn{padding:5px 11px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;}
.pcbtn.on{border-color:var(--ink);background:var(--ink);color:#fff;}
.plus-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:12px;}
.plus-table th{background:var(--alt);padding:6px 8px;font-weight:700;font-size:10px;text-align:left;color:var(--soft);border:1px solid var(--line-soft);}
.plus-table td{padding:6px 8px;border:1px solid var(--line-soft);vertical-align:top;}
.plus-table td.center{text-align:center;}
.plus-rule-box{font-size:11px;color:var(--soft);line-height:1.7;background:var(--card);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.plus-cross{font-size:10.5px;color:var(--muted);background:var(--alt);border-radius:6px;padding:7px 10px;margin-top:6px;}
.rider-card{background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px;margin-bottom:9px;}
.rider-cat{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--alt);color:var(--soft);display:inline-block;margin-bottom:6px;}
.rider-name{font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:6px;}
.rider-row{font-size:11.5px;margin-top:4px;line-height:1.6;}
.rider-row b{color:var(--soft);font-weight:700;margin-right:4px;}

/* 상품 필터 */
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.tier-cats{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.cat-header{font-size:12px;font-weight:700;color:var(--ink);margin:18px 0 8px;padding-bottom:4px;border-bottom:1.5px solid var(--line);}
.cat-header:first-child{margin-top:0;}
.fbtn{padding:5px 11px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;}
.fbtn.on{border-color:var(--ink);color:var(--ink);background:var(--ink);color:#fff;}
.fbtn.H{border-color:var(--H);}
.fbtn.H.on{background:var(--H);border-color:var(--H);}
.fbtn.G{border-color:var(--G);}
.fbtn.G.on{background:var(--G);border-color:var(--G);}
.fbtn.E{border-color:var(--E);}
.fbtn.E.on{background:var(--E);border-color:var(--E);}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--card);}
input[type=text]:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink);}
.hint{font-size:10.5px;color:var(--muted);margin-top:7px;}
main{flex:1;padding:12px 16px 50px;}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:60px 16px;line-height:1.9;}
.sec-label{font-size:10.5px;font-weight:700;color:var(--ink);margin:16px 0 7px;letter-spacing:.03em;}
.sec-label:first-child{margin-top:0;}
/* 카드 */
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:13px 15px;margin-bottom:9px;}
.card-title{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:6px;}
.cat-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--alt);color:var(--soft);margin-bottom:7px;}
/* 상품 배지 */
.pbadges{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;}
.pbadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;color:#fff;}
.pbadge.H{background:var(--H);}
.pbadge.G{background:var(--G);}
.pbadge.E{background:var(--E);}
.pbadge.B{background:var(--H);}
.pbadge.S{background:#B4540A;}
.fbtn.B{border-color:var(--H);}
.fbtn.B.on{background:var(--H);border-color:var(--H);}
.fbtn.S{border-color:#B4540A;}
.fbtn.S.on{background:#B4540A;border-color:#B4540A;}
.limit-table td.amt.B{color:var(--H);}
.limit-table td.amt.S{color:#B4540A;}
/* 한도 테이블 */
.limit-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px;}
.limit-table th{background:var(--alt);padding:5px 8px;font-weight:600;font-size:10.5px;text-align:left;color:var(--soft);}
.limit-table td{padding:5px 8px;border-top:1px solid var(--line-soft);}
.limit-table td.amt{font-weight:700;font-family:'SF Mono','Courier New',monospace;color:var(--ink);}
.limit-table td.amt.H{color:var(--H);}
.limit-table td.amt.G{color:var(--G);}
.limit-table td.amt.E{color:var(--E);}
.note-box{margin-top:8px;font-size:10.5px;color:var(--soft);padding:7px 10px;background:var(--alt);border-radius:6px;line-height:1.6;}
/* UW 카드 */
.uw-grid{display:grid;grid-template-columns:1fr auto;gap:5px 8px;font-size:12px;margin-bottom:4px;}
.uw-cat{color:var(--soft);}
.uw-val{font-weight:700;text-align:right;}
.uw-val.ok{color:var(--ok);}
.uw-val.no{color:var(--no);}
.uw-val.cond{color:var(--cond);}
.uw-val.day{color:var(--cond);}
.no-result{color:var(--muted);font-size:11.5px;padding:20px 0;text-align:center;}
.campbox{margin:8px 0 4px;padding:8px 10px;border-radius:8px;background:#fff6e5;border:1px solid #f0c67a;font-size:11.5px;color:#6a4a00;}
.campbox b{color:#b35c00;font-size:13px;}
.camptag{display:inline-block;background:#e8890b;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-right:6px;}
.campnote{color:#8a6a2a;font-size:10px;}
.ref-sec{background:var(--card,#fff);border:1px solid var(--line,#dfe2ec);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.ref-sec>h3{margin:0;padding:10px 13px;background:#17224f;color:#fff;font-size:13px;}
.ref-sec>div{padding:11px 13px;font-size:11.5px;line-height:1.6;}
.ref-tb{width:100%;border-collapse:collapse;font-size:10.5px;margin:6px 0;}
.ref-tb th,.ref-tb td{border:1px solid #dfe2ec;padding:5px 6px;text-align:center;vertical-align:middle;}
.ref-tb th{background:#eef1f8;color:#17224f;font-weight:700;}
.ref-tb td.l{text-align:left;}
.ref-scroll{overflow-x:auto;}
.ref-note{background:#eef1fb;border-left:3px solid #3a5ccc;padding:7px 10px;border-radius:4px;margin:7px 0;font-size:11px;}
.ref-q{background:#fff7e6;border:1px solid #ffdd8a;border-radius:7px;padding:8px 10px;margin:6px 0;font-size:11.5px;}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">새로담는 검색<span>라이나 새로담는건강보험 시리즈</span></div>
  <div class="mode-tabs">
    <button class="mtab on" id="m-uw" onclick="setMode('uw')">통합검색</button>
    <button class="mtab" id="m-res" onclick="setMode('res')">외국인여부</button>
    <button class="mtab" id="m-limit" onclick="setMode('limit')">가입한도</button>
    <button class="mtab" id="m-exc" onclick="setMode('exc')">예외인수질환</button>
    <button class="mtab" id="m-uw2" onclick="setMode('uw2')">UW가이드</button>
    <button class="mtab" id="m-ref" onclick="setMode('ref')">분류표</button>
  </div>
  <div class="filters" id="filters-uw">
    <button class="fbtn on" id="f-ALL" onclick="setFilter('ALL')">전체</button>
    <button class="fbtn B" id="f-B" onclick="setFilter('B')">건강체B</button>
    <button class="fbtn G" id="f-G" onclick="setFilter('G')">건강체G</button>
    <button class="fbtn S" id="f-S" onclick="setFilter('S')">표준체</button>
    <button class="fbtn E" id="f-E" onclick="setFilter('E')">유병자</button>
  </div>
  <div class="tier-cats" id="tier-cats" style="display:none;">
    <button class="fbtn B on" id="t-B" onclick="setTier('B')">건강체B</button>
    <button class="fbtn G" id="t-G" onclick="setTier('G')">건강체G</button>
    <button class="fbtn S" id="t-S" onclick="setTier('S')">표준체</button>
    <button class="fbtn E" id="t-E" onclick="setTier('E')">유병자</button>
  </div>
  <div class="tier-cats" id="ref-cats" style="display:none; flex-wrap:wrap;">
    <button class="fbtn on" id="rc-질병분류" onclick="setRefCat('질병분류')">질병분류표</button>
    <button class="fbtn" id="rc-질병검색" onclick="setRefCat('질병검색')">🔍 질병검색</button>
  </div>
  <div class="tier-cats" id="uw2-cats" style="display:none; flex-wrap:wrap;">
    <button class="fbtn on" id="uw2-면책감액" onclick="setUw2Cat('면책감액')">면책·감액</button>
    <button class="fbtn" id="uw2-알릴의무" onclick="setUw2Cat('알릴의무')">알릴의무</button>
    <button class="fbtn" id="uw2-합산한도" onclick="setUw2Cat('합산한도')">합산한도</button>
    <button class="fbtn" id="uw2-제도성" onclick="setUw2Cat('제도성')">치료비선지급</button>
    <button class="fbtn" id="uw2-신규심사" onclick="setUw2Cat('신규심사')">신규특약</button>
    <button class="fbtn" id="uw2-캠페인" onclick="setUw2Cat('캠페인')">캠페인</button>
  </div>
  <div class="tier-cats" id="exc-cats" style="display:none; flex-wrap:wrap;">
    <button class="fbtn on" id="ec-전체" onclick="setExcCat('전체')">전체</button>
    <button class="fbtn" id="ec-간/담도질환" onclick="setExcCat('간/담도질환')">간/담도</button>
    <button class="fbtn" id="ec-갑상선/부갑상선질환" onclick="setExcCat('갑상선/부갑상선질환')">갑상선</button>
    <button class="fbtn" id="ec-근골격계질환" onclick="setExcCat('근골격계질환')">근골격계</button>
    <button class="fbtn" id="ec-골절" onclick="setExcCat('골절')">골절</button>
    <button class="fbtn" id="ec-구강질환" onclick="setExcCat('구강질환')">구강</button>
    <button class="fbtn" id="ec-귀/청력질환" onclick="setExcCat('귀/청력질환')">귀/청력</button>
    <button class="fbtn" id="ec-안과질환" onclick="setExcCat('안과질환')">안과</button>
    <button class="fbtn" id="ec-생식기질환" onclick="setExcCat('생식기질환')">생식기</button>
    <button class="fbtn" id="ec-신경기능장애" onclick="setExcCat('신경기능장애')">신경기능</button>
    <button class="fbtn" id="ec-비뇨/신장질환" onclick="setExcCat('비뇨/신장질환')">비뇨/신장</button>
    <button class="fbtn" id="ec-소화기질환" onclick="setExcCat('소화기질환')">소화기</button>
    <button class="fbtn" id="ec-양성신생물" onclick="setExcCat('양성신생물')">양성신생물</button>
    <button class="fbtn" id="ec-호흡기질환" onclick="setExcCat('호흡기질환')">호흡기</button>
    <button class="fbtn" id="ec-피부질환" onclick="setExcCat('피부질환')">피부</button>
    <button class="fbtn" id="ec-기타질환" onclick="setExcCat('기타질환')">기타</button>
  </div>
  <input type="text" id="q" placeholder="담보명 또는 질병명 검색 (예: 암진단, 디스크, 골절)" autocomplete="off" autocapitalize="off">
  <div class="hint" id="hint">가입한도·보장(120특약, 교안 2026-P-CL-0414 · 26.11.03) + 3N5(132) + SI예외질환(710) · 오프라인 작동</div>
</header>
<main id="results">
  <div class="empty">담보명이나 질병명을 입력하세요.<br><br>예) "뇌출혈" · "관절" · "디스크" · "암진단" · "양성신생물"</div>
</main>

function norm(s){return (s||'').toLowerCase().replace(/\s+/g,'').replace(/[,()·\-·]/g,'');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function valClass(v){
  if(v==='즉시인수') return 'ok';
  if(v==='불가') return 'no';
  if(v.startsWith('30일')) return 'day';
  return 'cond';
}
function valShort(v){
  if(v==='즉시인수') return '즉시인수';
  if(v==='불가') return '불가';
  if(v==='30일경과 인수') return '30일경과';
  if(v==='30일경과 인수(수술불가)') return '30일경과(수술불가)';
  if(v==='조건부(세부확인)') return '조건부';
  return v;
}

function splitPayoutNote(note){
  if(!note) return {payout:'', rest:''};
  const parts = note.split(' · ');
  const payoutParts = parts.filter(p=>p.indexOf('지급액')!==-1);
  const restParts = parts.filter(p=>p.indexOf('지급액')===-1);
  return { payout: payoutParts.join(' · '), rest: restParts.join(' · ') };
}


// 지급률 × 가입한도 → 실지급액 (만원)
function fmtMan(v){
  if(v==null) return '—';
  if(v>=10000 && v%10000===0) return (v/10000)+'억원';
  const r = Math.round(v*100)/100;
  return (Number.isInteger(r)? r.toLocaleString() : r.toLocaleString(undefined,{maximumFractionDigits:2}))+'만원';
}

d><td>10년이내 입원, 수술</td><td class=\"l\">N(2,5,10)년이내 입원, 수술</td></tr><tr><td class=\"l\">Q5</td><td class=\"l\">5년이내 10대질병* 진단, 입원, 수술, 치료, 투약<br>*암, 백혈병, 고혈압, 협심증, 심근경색, 심장판막증, 간경화증, 뇌졸중증, 당뇨병, 에이즈</td><td>〃</td><td class=\"l\">5년이내 6대질병* 진단, 입원, 수술<br>*암, 백혈병, 뇌혈관질환, 허혈성심장질환, 심장판막증, 간경화증</td><td class=\"l\">5년이내 6대질병* 진단, 입원, 수술<br>*암, 백혈병, 뇌혈관질환, 허혈성심장질환, 심장판막증, 간경화증</td></tr><tr><td class=\"l\">추가질문</td><td>10년이내 입원, 수술</td><td>-</td><td class=\"l\">5년이내 3대질병* 진단, 입원, 수술, 치료, 투약<br>*고혈압, 당뇨병, 이상지질혈증</td><td>-</td></tr></tbody></table></div><div style=\"font-size:10px;color:var(--muted);margin-top:6px;\">출처: 2026-P-CL-0414 GA 표준교안 (26.11.03) p6</div>"}, {"cat": "알릴의무", "title": "신정원 체크 · 상품별 가입제한", "html": "<div class=\"ref-note\"><b>*신정원 체크</b> : 뇌혈관질환진단 · 허혈성심장질환진단 — 동일담보 3개월 내 타사 가입 건 있을 경우 <b>청약 불가</b></div><div class=\"ref-scroll\"><table class=\"ref-tb\"><thead><tr><th>구분</th><th>내용</th></tr></thead><tbody><tr><td class=\"l\">건강심사형플러스 주계약</td><td class=\"l\">일반사망 급부 합산 제외, 인수기준 완화, 진단검사 제외 / 단, 타사합산 있음. 주계약 가입금액 &amp; 사망담보 합산 30억 미만 시 재정증빙 생략</td></tr><tr><td class=\"l\">가입나이 — 건강심사형플러스</td><td class=\"l\">1종 BLUE: 20·30년납 만15-40세 / 2종 GOLD: 20년납 41-70세, 30년납 41-69세 (100세 만기, 월납 최소 2만)</td></tr><tr><td class=\"l\">가입나이 — 일반심사형</td><td class=\"l\">20년납 만15-79세 / 30년납 만15-69세 (100세 만기, 월납 최소 2만)</td></tr><tr><td class=\"l\">가입나이 — 간편심사형</td><td class=\"l\">비갱신 20년납 30-79세 / 30년납 30-69세 · 갱신 전기납 30-80세 (30년만기는 70세)</td></tr><tr><td class=\"l\">특약명 규칙</td><td class=\"l\">건강심사형 비갱신 '무배당새로담는건강(특약명)(해약환급금미지급형Ⅱ)' / 일반심사형 비갱신 '무배당새로담는(특약명)(해약환급금미지급형Ⅱ)' / 간편심사형 비갱신 '무배당새로담는간편(특약명)(해약환급금미지급형Ⅱ)'</td></tr><tr><td class=\"l\">보험종목 표기</td><td class=\"l\">1종 BLUE, 2종 GOLD에 따라 상품명칭에 \"B\" 또는 \"G\" 표기</td></tr></tbody></table></div>"}, {"cat": "합산한도", "title": "합산한도 (교안 26.11.03 기준)", "html": "<div class=\"ref-scroll\"><table class=\"ref-tb\"><thead><tr><th>구분</th><th>합산 기준</th></tr></thead><tbody><tr><td class=\"l\">치료별암직접치료(SI포함)</td><td class=\"l\">한도 신설 및 3,000만원 설정 — 치료별 d class=\"l\">유의사항</td><td class=\"l\">계약자가 요율전환을 신청한 날 이후로 최초 도래하는 보험료 납입일로 요율이 전환 적용, 소급적용 불가 · 보험료 변경 이후 계약자/피보험자가 고의 또는 중대한 과실로 \"요율전환전 계약\"의 \"무사고\" 판별 기준이 되는 사고를 알리지 않은 경우, 요율전환을 무효로 하며 \"요율전환전 계약\"으로 소급 원복됨에 따라, 요율전환전 계약의 유지를 위한 미납보험료 추징, 보험료 증액의 추가납입을 요구할 수 있으며 연체 시 제지급금에서 해당 금액을 차감할 수 있음</td></tr></tbody></table></div><div style=\"font-size:10px;color:var(--muted);margin-top:6px;\">출처: 2026-P-CL-0414 GA 표준교안 (26.11.03) p8</div>"}, {"cat": "신규심사", "title": "신규특약 질병 심사기준 (2026.10.1)", "html": "<div class=\"ref-scroll\"><table class=\"ref-tb\"><thead><tr><th>특약</th><th>질병심사 기준</th></tr></thead><tbody><tr><td class=\"l\">암주요검사케어 · 호르몬관련암통합케어 · 10대주요장기암통합케어 · 혈액관련암통합케어 · 통합신생물수술</td><td class=\"l\">암 심사기준</td></tr><tr><td class=\"l\">폐렴진단</td><td class=\"l\">만성호흡기질환 기왕력 인수불가</td></tr><tr><td class=\"l\">염증성장질환(크론병및궤양성대장염)진단</td><td class=\"l\">염증성장질환 기왕력 인수불가</td></tr><tr><td class=\"l\">급여요실금수술</td><td class=\"l\">요실금 기왕력 인수불가</td></tr><tr><td class=\"l\">충수염수술</td><td class=\"l\">질병이력 무관 인수가능</td></tr><tr><td class=\"l\">고고당 3종 (치료 · 중등도이상진단 · 중증진단)</td><td class=\"l\">고고당 심사기준 (3N5 예외인수질환 탭의 \"고고당\" 열 참고)</td></tr><tr><td class=\"l\">대상포진진단</td><td class=\"l\">대상포진 기왕력 인수불가</td></tr><tr><td class=\"l\">통풍진단</td><td class=\"l\">통풍 기왕력 인수불가</td></tr></tbody></table></div><div class=\"ref-note\">출처: UW가이드 5p · 고고당 경증예외질환 불가 11개: UW가이드 7p</div>"}, {"cat": "신규심사", "title": "신규특약 가입금액 · 판매단위 (교안 26.11.03)", "html": "<div class=\"ref-scroll\"><table class=\"ref-tb\"><thead><tr><th>특약</th><th>건강체B</th><th>건강체G</th><th>표준체</th><th>유병자</th></tr></thead><tbody><tr><td class=\"l\">암주요검사케어</td><td>1천만원 (단일한도)</td><td>1천만원 (단일한도)</td><td>1천만원 (단일한도)</td><td>1천만원 (단일한도)</td></tr><tr><td class=\"l\">호르몬관련암통합케어</td><td class=\"l\">500만~2,000만<br><span style=\"color:#888;\">판매단위 500만</span></td><td class=\"l\">500만~2,000만<br><span style=\"color:#888;\">판매단위 500만</span></td><td class=\"l\">500만~2,000만<br><span style=\"color:#888;\">판매단위 500만</span></td><td class=\"l\">500만~2,00 준교안 (26.11.03) p83~84</div>"}];
let curRefCat='질병분류';
let curUw2Cat='면책감액';
function setRefCat(c){
  curRefCat=c;
  ['질병분류','질병검색'].forEach(k=>{
    const el=document.getElementById('rc-'+k);
    if(el) el.classList.toggle('on', k===c);
  });
  renderRef();
}

function setUw2Cat(c){
  curUw2Cat=c;
  ['면책감액','알릴의무','합산한도','제도성','신규심사','캠페인'].forEach(k=>{
    const el=document.getElementById('uw2-'+k);
    if(el) el.classList.toggle('on', k===c);
  });
  renderUw2();
}
function renderUw2(){
  const q=norm(document.getElementById('q').value||'');
  const res=document.getElementById('results');
  const secs=REF_SECTIONS.filter(s=>s.cat===curUw2Cat);
  if(!secs.length){ res.innerHTML='<div class="no-result">검색 결과가 없습니다.</div>'; return; }

  if(!q){
    // 검색어 없으면 전체 표 그대로 출력
    res.innerHTML=secs.map(s=>'<div class="ref-sec"><h3>'+esc(s.title)+'</h3><div>'+s.html+'</div></div>').join('');
    return;
  }

  // 검색어 있으면 행 단위 필터링
  let totalHits=0;
  const out=secs.map(sec=>{
    // 임시 DOM 파싱으로 tr 필터링
    const tmp=document.createElement('div');
    tmp.innerHTML=sec.html;
    const tables=tmp.querySelectorAll('table');
    if(!tables.length){
      // 테이블 없는 섹션: 전체 텍스트 매칭
      if(norm(sec.html).includes(q)){ totalHits++; return '<div class="ref-sec"><h3>'+esc(sec.title)+'</h3><div>'+sec.html+'</div></div>'; }
      return '';
    }
    let secHit=0;
    tables.forEach(tbl=>{
      const rows=tbl.querySelectorAll('tbody tr');
      rows.forEach(tr=>{
        const txt=norm(tr.textContent);
        if(txt.includes(q)){
          tr.style.background='#fffbe6';
          secHit++;
        } else {
          tr.style.display='none';
        }
      });
    });
    if(!secHit) return '';
    totalHits+=secHit;
    return '<div class="ref-sec"><h3>'+esc(sec.title)+'<span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:6px;">'+secHit+'행 매칭</span></h3><div>'+tmp.innerHTML+'</div></div>';
  }).join('');

  if(!totalHits){ res.innerHTML='<div class="no-result">검색 결과가 없습니다.</div>'; return; }
  res.innerHTML='<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">총 '+totalHits+'행 매칭</div>'+out;
}
function renderRef(){
  const q=norm(document.getElementById('q').value||'');
  const res=document.getElementById('results');

  // 질병검색 모드
  if(curRefCat==='질병검색'){
    const BADGE={
      '순환계질환':'#1B6CA8','뇌혈관·허혈성심장':'#7B2D8B',
      '관절·특정심장질환':'#2E7D32','통합재해진단':'#B45309'
    };
    const JONG_COLOR={'2종':'#4A90D9','3종':'#27AE60','4종':'#E67E22','5종':'#E74C3C',
                      '1%':'#27AE60','10%':'#E67E22','100%':'#E74C3C','-':''};
    let rows=DIAG_ROWS;
    if(q) rows=rows.filter(r=>norm(r.name).includes(q)||norm(r.code).includes(q)||norm(r.sub).includes(q)||norm(r.note).includes(q));
    if(!rows.length){ res.innerHTML='<div class="no-result">검색 결과가 없습니다.</div>'; return; }
    // 그룹별로 묶어서 출력
    const groups={};
    rows.forEach(r=>{ if(!groups[r.g]) groups[r.g]=[]; groups[r.g].push(r); });
    res.innerHTML=Object.entries(groups).map(([g,rs])=>{
      const bg=BADGE[g]||'#555';
      const header='<div style="font-weight:700;font-size:12px;color:'+bg+';margin:12px 0 6px;border-left:4px solid '+bg+';padding-left:8px;">'+esc(g)+'<span style="font-weight:400;font-size:10px;color:#888;margin-left:6px;">'+rs.length+'건</span></div>';
      const tbl='<div class="ref-scroll"><table class="ref-tb"><thead><tr>'
        +'<th>질환명</th><th>코드</th><th>구분/종</th><th>비고</th>'
        +'</tr></thead><tbody>'
        +rs.map(r=>{
          const jc=JONG_COLOR[r.jong]||'#555';
          const jbadge=r.jong&&r.jong!=='-'?'<span style="background:'+jc+';color:#fff;padding:1px 5px;border-radius:3px;font-size:10px;">'+esc(r.jong)+'</span>':'';
          return '<tr><td>'+esc(r.name)+'</td><td style="font-family:monospace;">'+esc(r.code)+'</td><td>'+jbadge+'</td><td style="font-size:10px;color:#666;">'+esc(r.sub||r.note||'')+'</td></tr>';
        }).join('')
        +'</tbody></table></div>';
      return header+tbl;
    }).join('');
    return;
  }

  // 질병분류표 — 행 단위 검색
  const secs=REF_SECTIONS.filter(s=>s.cat===curRefCat);
  if(!secs.length){ res.innerHTML='<div class="no-result">검색 결과가 없습니다.</div>'; return; }

  if(!q){
    res.innerHTML=secs.map(s=>'<div class="ref-sec"><h3>'+esc(s.title)+'</h3><div>'+s.html+'</div></div>').join('');
    return;
  }

  // 행 단위 필터링
  let totalHits=0;
  const out=secs.map(sec=>{
    const tmp=document.createElement('div');
    tmp.innerHTML=sec.html;
    const tables=tmp.querySelectorAll('table');
    if(!tables.length){
      if(norm(sec.html).includes(q)){ totalHits++; return '<div class="ref-sec"><h3>'+esc(sec.title)+'</h3><div>'+sec.html+'</div></div>'; }
      return '';
    }
    let secHit=0;
    tables.forEach(tbl=>{
      tbl.querySelectorAll('tbody tr').forEach(tr=>{
        if(norm(tr.textContent).includes(q)){
          tr.style.background='#fffbe6';
          secHit++;
        } else {
          tr.style.display='none';
        }
      });
    });
    if(!secHit) return '';
    totalHits+=secHit;
    return '<div class="ref-sec"><h3>'+esc(sec.title)+'<span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:6px;">'+secHit+'행 매칭</span></h3><div>'+tmp.innerHTML+'</div></div>';
  }).join('');

  if(!totalHits){ res.innerHTML='<div class="no-result">검색 결과가 없습니다.</div>'; return; }
  res.innerHTML='<div style="font-size:10px;color:var(--muted);margin-bottom:8px;">총 '+totalHits+'행 매칭</div>'+out;
}

function renderExc(){
  const res=document.getElementById('results');
  const q=document.getElementById('q').value;

  // 3N5 데이터 필터
  let list3n5 = UW;
  if(curExcCat!=='전체') list3n5 = list3n5.filter(r=>r.cat===curExcCat);

  // SI 710 데이터 필터 (검색어 있을 때만, 전체 표시는 너무 많음)
  let list710 = [];

  }

  if(!list3n5.length && !list710.length){
    res.innerHTML='<div class="no-result">검색 결과가 없어요. 다른 표현으로 검색해보세요.</div>';

  let html='';

  // 3N5 결과
  if(list3n5.length){
    html+='<div class="note-box" style="margin-bottom:8px;">고고당 = 10/1 신설 · 3.10.5.5 고고당 특약 인수기준. UW가이드(10/1) 기준 불가 11개 외에는 즉시인수로 표기 — 세부는 별도 배포 경증예외질환 리스트 확인</div>';
    html+='<div class="sec-label">📋 3N5 경증예외질환 ('+list3n5.length+'항목) · 심뇌/암/입수(HC)/재해/질병장해/관절수술/척추수술/고고당(10/1 신설)</div>';
    let curCat='';
    list3n5.forEach(row=>{
      if(!nq && curExcCat==='전체' && row.cat!==curCat){ curCat=row.cat; html+='<div class="cat-header">'+esc(row.cat)+'</div>'; }
      html+=renderUW(row);
    });
  }

  // SI 710 결과 (검색어 있을 때만)
  if(list710.length){

function findAggLinkHtml(riderName, map){
  map = map || AGG_LINK;

  if(!links || !links.length) return '';
  let html = '<div class="rider-row" style="margin-top:8px;"><b>당사·업계 합산한도</b></div>';
  links.forEach(l=>{
    if(l.indexOf('AGE:')===0){
      const name = l.slice(4);
      const row = PLUSDATA.aggCancerAge.find(r=>r.name===name);
      if(row){
        let line = esc(row.name)+': 30~40세 '+esc(row.d3040)+' · 41~60세 '+esc(row.d4160)+' · 61~80세 '+esc(row.d6180);
        if(row.biz3050 && row.biz3050!=='-') line += ' · 업계 30~50세 '+esc(row.biz3050)+' · 51~80세 '+esc(row.biz5180);
        html += '<div class="plus-cross">'+line+'</div>';

    } else if(l.indexOf('OUT:')===0){
      const code = l.slice(4);
      const row = PLUSDATA.aggCancerOut.find(r=>r.code===code);
      if(row){
        html += '<div class="plus-cross">'+esc(row.name)+' 당사합산: '+esc(row.amt)+'</div>';
      }
    }
  });
  return html;
}

}
function valShort710(v){

  return v;
}

  if(nq) list=list.filter(r=>sdMatch(r,nq));
  if(!list.length){ res.innerHTML='<div class="no-result">검색 결과가 없어요. 다른 표현으로 검색해보세요.</div>'; return; }
  let html='<div class="sec-label">📋 '+esc(SDPF[p])+' 가입가능 특약 ('+list.length+')'+(nq?'':' · 가입불가 '+naCount+'개 제외')+'</div>';
  let cur='';
  list.forEach(r=>{
    if(!nq && r.cat!==cur){ cur=r.cat; html+='<div class="cat-header">'+esc(r.cat)+'</div>'; }
    html+=sdCard(r,[p]);
  });
  html+='<div class="hint" style="text-align:center;margin-top:14px;">기준: '+esc(SD.meta.source)+'</div>';
  res.innerHTML=html;
}

function doSearch(){
  const q = document.getElementById('q').value;
  const nq = norm(q);
  const res = document.getElementById('results');

  // 예외인수질환 모드
  if(curMode==='exc'){
    renderExc();
    return;
  }

  // UW가이드 모드
  if(curMode==='uw2'){
    renderUw2();
    return;
  }

  // 분류표 모드
  if(curMode==='ref'){
    renderRef();
    return;
  }

  // 가입한도 모드 (플러스/표준체/간편 3개 상품군 탭 내 검색)
  if(curMode==='limit'){
    renderTier();
    return;
  }

  // 체류코드 모드는 별도 (예/아니오 조회이므로 통합검색 대상 아님)
  if(curMode==='res'){
    if(!nq){
      res.innerHTML='<div class="empty">체류코드(예: D-7) 또는 체류자격명(예: 방문취업)을 입력하세요.</div>';
      return;
    }
    const matches = RESIDENCY.filter(item=>{
      if(norm(item.code).includes(nq)) return true;
      if(norm(item.label).includes(nq)) return true;
      return false;
    });
    if(!matches.length){
      res.innerHTML='<div class="no-result">검색 결과가 없어요. 체류코드(예: D-7) 또는 체류자격명으로 검색해보세요.</div>';
      return;
    }
    let rhtml='<div class="sec-label">🌏 외국인 체류코드별 가입 유무 ('+matches.length+')</div>';
    matches.forEach(item=>{ rhtml+=renderResidency(item); });
    res.innerHTML=rhtml;
    return;
  }

  if(!nq){
    res.innerHTML='<div class="empty">담보명이나 질병명을 입력하세요.<br><br>예) "뇌출혈" · "관절" · "디스크" · "암진단" · "양성신생물" · "다빈치"</div>';
    return;
  }

  // ===== 통합 검색: 건강체B·G / 표준체 / 유병자 (교안 26.11.03) =====
  let html='', total=0;

  // 1. 가입한도·보장내용 (교안 기준)
  const showProds = curFilter==='ALL' ? SDP : [curFilter];
  const sdMatches = SD.riders.filter(r=>sdMatch(r,nq) && showProds.some(p=>!r.prods[p].na));
  if(sdMatches.length){
    html += '<div class="sec-label">📋 가입한도·지급금액 ('+sdMatches.length+') <span style="font-weight:400;color:var(--muted);">교안 26.11.03 기준</span></div>';
    sdMatches.forEach(r=>{ html+=sdCard(r, showProds); });
    total+=sdMatches.length;
  }

  // 2. 3N5 경증예외질환 검색
  const uwMatches = UW.filter(row=>norm(row.name).includes(nq));
  if(uwMatches.length){
    html += '<div class="sec-label">✅ 3N5 경증예외질환 인수기준 ('+uwMatches.length+')</div>';
    uwMatches.slice(0,30).forEach(row=>{ html+=renderUW(row); });
    total+=uwMatches.length;
  }

  // 3. SI 인수 710 검색
  const uw710Matches = UW710.filter(row=>norm(row.name).includes(nq)||norm(row.cat).includes(nq));
  if(uw710Matches.length){
    html += '<div class="sec-label">🔍 SI 예외질환 인수기준 ('+uw710Matches.length+'개 / 전체 710개)</div>';
    uw710Matches.slice(0,30).forEach(row=>{ html+=renderUW710(row); });
    if(uw710Matches.length>30) html+='<div style="color:var(--muted);font-size:11px;padding:8px 0;">... '+uw710Matches.length+'개 중 30개만 표시. 검색어를 더 구체적으로 입력해보세요.</div>';
    total+=uw710Matches.length;
  }

  if(!total){
    html='<div class="no-result">검색 결과가 없어요. 다른 표현으로 검색해보세요.</div>';
  }
  res.innerHTML=html;
}
